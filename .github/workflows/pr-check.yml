name: Build and Test

# trigger
on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Check Node and npm versions
        run: |
          node -v
          npm -v

      - run: npm ci
      - run: npm run build
